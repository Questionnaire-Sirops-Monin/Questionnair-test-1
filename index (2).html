    if(q.id==="VW_TROPCHER"){const w=el("div",{class:"status warn",id:"vwwarn"},"Vos prix ne vont pas en montant : normalement, le prix « trop bon marché » est le plus bas et le prix « trop cher » le plus élevé. Vérifiez vos réponses.");w.hidden=!(VW.every(k=>!isNaN(euro(S.answers[k])))&&!vwCoherent(S.answers));v.append(w)}
  }
  v.append(el("div",{class:"submit-row"},
    el("button",{class:"btn send",id:"send",onclick:submitForm},"Envoyer"),
    el("a",{href:"#",class:"link",onclick:e=>{e.preventDefault();newForm()}},"Effacer le formulaire")));
}
function submitForm(){
  S.tried=true;
  if(!S.consent){render();document.getElementById("consent")?.scrollIntoView({behavior:"smooth",block:"center"});return}
  const miss=Q.find(q=>visible(q,S.answers)&&required(q)&&!answered(q));
  if(miss){render();const c=document.getElementById("card_"+miss.id);c?.scrollIntoView({behavior:"smooth",block:"center"});c?.querySelector("input,button")?.focus({preventScroll:true});return}
  S.step="done";render();window.scrollTo(0,0);save();
}
function dbNotice(){
  if(dbState!=="off")return null;
  return el("div",{class:"status warn"},"Les réponses ne peuvent pas être enregistrées depuis cette vue. Vous pouvez parcourir le questionnaire, mais rien ne sera sauvegardé.");
}
const URL_GOOGLE="https://script.google.com/macros/s/AKfycbxBIsvdbHVYzVraEnpcWhhuzp0tGzmknmAH9sem7XbhWGEXBEmVrCUSFqLpcOghLXLm/exec";
// Une colonne par question dans Google Sheets ; les affirmations notées ont chacune leur colonne
async function save(){
  const a=S.answers, num=n=>String(n).replace(".",",");
  const out=new URLSearchParams();
  out.append("VERSION",a.VERSION+" ("+MATIERE[a.VERSION]+")");
  for(const q of Q){
    if(q.type==="offer"||!visible(q,a)||a[q.id]===undefined)continue;
    const v=a[q.id];
    if(q.type==="likert"||q.type==="grid")q.rows.forEach(r=>out.append(q.id+" · "+r,v[r]||""));
    else if(Array.isArray(v))out.append(q.id,v.join(" | "));
    else if(q.type==="euros"&&!(q.alts||[]).includes(v))out.append(q.id,num(euro(v)));
    else out.append(q.id,v);
  }
  out.append("VW_COHERENT",vwCoherent(a)?"oui":"non");
  out.append("ORDRE_AFFICHAGE",JSON.stringify(S.order));
  const s=document.getElementById("save-status");
  try{
    await fetch(URL_GOOGLE,{method:"POST",mode:"no-cors",body:out});
    if(s)s.textContent="Réponse enregistrée.";
  }catch(e){
    if(s){s.className="status warn";s.textContent="L'envoi a échoué. Vérifiez votre connexion internet puis cliquez sur « Réessayer ».";
      s.append(" ",el("a",{href:"#",class:"link",onclick:ev=>{ev.preventDefault();s.className="status";s.textContent="Enregistrement en cours…";save()}},"Réessayer"))}
  }
}

/* ---------- Résultats ---------- */
let F={age:"all",genre:"all",version:"all"};
function filtered(){return rows.filter(r=>(F.version==="all"||r.VERSION===F.version)&&(F.age==="all"||tranche(r.AGE)===F.age)&&(F.genre==="all"||r.GENRE===F.genre))}
function bars(q,data,cls){
  const vals=q.type==="number"?data.map(r=>tranche(r[q.id])).filter(Boolean):data.map(r=>r[q.id]).filter(x=>x!==undefined);
  if(q.type==="number")q={...q,type:"single",options:AGES,text:q.text+" (par tranche)"};
  const base=vals.length;
  const box=el("div",{class:"res"},el("h3",{},q.text),el("div",{class:"meta"},`${q.id} · base : ${base} répondant${base>1?"s":""}`));
  if(!base){box.append(el("div",{class:"meta"},"Aucune réponse pour l'instant."));return box}
  if(q.type==="euros"){
    const nums=vals.filter(v=>typeof v==="number").sort((x,y)=>x-y), alts=(q.alts||[]).map(o=>[o,vals.filter(v=>v===o).length]);
    const med=nums.length?(nums.length%2?nums[(nums.length-1)/2]:(nums[nums.length/2-1]+nums[nums.length/2])/2):null;
    const moy=nums.length?nums.reduce((x,y)=>x+y,0)/nums.length:null;
    box.append(el("div",{class:"meta"},nums.length?`Médiane : ${fe(med)} · moyenne : ${fe(moy)} · de ${fe(nums[0])} à ${fe(nums[nums.length-1])} (${nums.length} montants)`:"Aucun montant saisi."));
    alts.forEach(([o,n])=>box.append(el("div",{class:"meta"},`« ${o} » : ${n}`)));
    return box;
  }
  if(q.type==="text"){
    const list=el("ul",{class:"answers"});
    vals.filter(v=>String(v).trim()).slice(0,30).forEach(v=>list.append(el("li",{},String(v))));
    box.append(list);
    if(vals.length>30)box.append(el("div",{class:"meta"},`30 réponses affichées sur ${vals.length}. Toutes figurent dans l'export CSV.`));
    return box;
  }
  if(q.type==="scale"){
    const m=vals.reduce((t,v)=>t+Number(v),0)/base;
    box.append(el("div",{class:"meta"},"Note moyenne : "+m.toLocaleString("fr-FR",{maximumFractionDigits:1})+" / 10"));
  }
  if(q.type==="likert"){
    for(const r of q.rows){
      const top=q.options.slice(2), ok=vals.filter(v=>top.includes(v[r])).length, p=Math.round(ok/base*100);
      box.append(el("div",{class:"bar "+cls},el("span",{},r),el("div",{class:"track"},el("i",{style:`width:${p}%`})),el("span",{class:"n"},`${p} % ${q.id==="ATTENTES"?"important":"d'accord"}`)));
    }
    return box;
  }
  if(q.type==="grid"){
    for(const r of q.rows){
      const sc=vals.map(v=>Number(v[r])).filter(x=>x>0), m=sc.length?sc.reduce((x,y)=>x+y,0)/sc.length:0;
      box.append(el("div",{class:"bar "+cls},el("span",{},r),el("div",{class:"track"},el("i",{style:`width:${m/5*100}%`})),el("span",{class:"n"},m.toLocaleString("fr-FR",{maximumFractionDigits:1})+" / 5")));
    }
    return box;
  }
  for(const o of q.options){
    const n=vals.filter(v=>Array.isArray(v)?v.includes(o):v===o).length, p=Math.round(n/base*100);
    box.append(el("div",{class:"bar "+cls},el("span",{},o),el("div",{class:"track"},el("i",{style:`width:${p}%`})),el("span",{class:"n"},`${p} % (${n})`)));
  }
  return box;
}
function pct(data,id,val){const v=data.filter(r=>r[id]);return v.length?Math.round(v.filter(r=>r[id]===val).length/v.length*100)+" %":"–"}
const fe=x=>x==null||isNaN(x)?"–":x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
/* Van Westendorp : courbes cumulées et points d'intersection */
function vwAnalyse(list){
  const R=list.filter(r=>VW.every(k=>typeof r[k]==="number")&&r.VW_COHERENT);
  if(R.length<2)return {n:R.length};
  const tb=R.map(r=>r.VW_TROPBAS),bm=R.map(r=>r.VW_BONMARCHE),ch=R.map(r=>r.VW_CHER),tc=R.map(r=>r.VW_TROPCHER),N=R.length;
  const hi=Math.ceil(Math.max(...tc))+1;
  const f={tropBas:p=>tb.filter(x=>x>=p).length/N,bonMarche:p=>bm.filter(x=>x>=p).length/N,cher:p=>ch.filter(x=>x<=p).length/N,tropCher:p=>tc.filter(x=>x<=p).length/N,
    pasBonMarche:p=>bm.filter(x=>x<p).length/N,pasCher:p=>ch.filter(x=>x>p).length/N};
  // g décroît, h croît : on cherche le premier prix (au centime) où g passe sous h
  const cross=(g,h)=>{for(let c=0;c<=hi*100;c++){const p=c/100;if(g(p)-h(p)<=0)return p}return null};
  return {n:N,
    pmc:cross(f.tropBas,f.pasBonMarche),   // prix minimum acceptable
    opp:cross(f.tropBas,f.tropCher),       // prix optimal
    ipp:cross(f.bonMarche,f.cher),         // prix d'indifférence
    pme:cross(f.pasCher,f.tropCher),       // prix maximum acceptable
    m:VW.map(k=>med(R.map(r=>r[k])))};
}
function vwTable(data){
  const A=data.filter(r=>r.VERSION==="A"),B=data.filter(r=>r.VERSION==="B");
  const va=vwAnalyse(A),vb=vwAnalyse(B);
  const excl=g=>g.filter(r=>VW.every(k=>typeof r[k]==="number")&&!r.VW_COHERENT).length;
  const ctl=g=>{const c=g.filter(r=>r.CONTROLE);return c.length?Math.round(c.filter(r=>r.CONTROLE_OK).length/c.length*100)+" %":"–"};
  const ages=g=>{const n=g.map(r=>Number(r.AGE)).filter(x=>x>0);return n.length?Math.round(n.reduce((x,y)=>x+y,0)/n.length)+" ans":"–"};
  const diff=(x,y)=>x==null||y==null?"–":(y-x>=0?"+":"")+fe(y-x);
  const row=(label,a,b,d,cls)=>el("tr",{class:cls||""},el("th",{scope:"row"},label),el("td",{},a),el("td",{},b),el("td",{},d==null?"":d));
  const t=el("table",{class:"vw-table"},
    el("thead",{},el("tr",{},el("th",{},""),el("th",{},"A · verre"),el("th",{},"B · carton plastifié"),el("th",{},"Écart B − A"))),
    el("tbody",{},
      row("Répondants retenus",String(va.n),String(vb.n),""),
      row("Écartés (prix incohérents)",String(excl(A)),String(excl(B)),""),
      row("Prix minimum acceptable",fe(va.pmc),fe(vb.pmc),diff(va.pmc,vb.pmc)),
      row("Prix optimal",fe(va.opp),fe(vb.opp),diff(va.opp,vb.opp),"key"),
      row("Prix d'indifférence",fe(va.ipp),fe(vb.ipp),diff(va.ipp,vb.ipp)),
      row("Prix maximum acceptable",fe(va.pme),fe(vb.pme),diff(va.pme,vb.pme),"key"),
      row("Médiane « trop bon marché »",fe(va.m?.[0]),fe(vb.m?.[0]),diff(va.m?.[0],vb.m?.[0])),
      row("Médiane « bon marché »",fe(va.m?.[1]),fe(vb.m?.[1]),diff(va.m?.[1],vb.m?.[1])),
      row("Médiane « cher »",fe(va.m?.[2]),fe(vb.m?.[2]),diff(va.m?.[2],vb.m?.[2])),
      row("Médiane « trop cher »",fe(va.m?.[3]),fe(vb.m?.[3]),diff(va.m?.[3],vb.m?.[3]))));
  const p=el("table",{class:"vw-table"},
    el("thead",{},el("tr",{},el("th",{},"Contrôle du tirage"),el("th",{},"A · verre"),el("th",{},"B · carton plastifié"),el("th",{},""))),
    el("tbody",{},
      row("Répondants",String(A.length),String(B.length),""),
      row("Âge moyen",ages(A),ages(B),""),
      row("Femmes",pct(A,"GENRE","Une femme"),pct(B,"GENRE","Une femme"),""),
      row("Acheteurs Monin (12 mois)",(()=>{const c=A.filter(r=>r.ACHAT);return c.length?Math.round(c.filter(r=>r.ACHAT!=="Non").length/c.length*100)+" %":"–"})(),(()=>{const c=B.filter(r=>r.ACHAT);return c.length?Math.round(c.filter(r=>r.ACHAT!=="Non").length/c.length*100)+" %":"–"})(),"")));
  return el("div",{class:"vw-wrap"},
    el("p",{class:"meta"},"Méthode Van Westendorp : les répondants dont les quatre prix ne montent pas sont écartés du calcul. Le prix optimal croise « trop bon marché » et « trop cher » ; la zone acceptable va du prix minimum au prix maximum acceptable."),
    el("div",{class:"grid-wrap"},t),
    el("p",{class:"meta"},"Les deux groupes doivent avoir des profils proches. Sinon, l'écart de prix peut venir du public et non de la bouteille."),
    el("div",{class:"grid-wrap"},p));
}
function renderR(){
  const v=$("#view-r");v.replaceChildren();
  if(dbState!=="ok"){
    v.append(el("section",{class:"card"},el("h2",{class:"q"},"Résultats indisponibles"),el("p",{},dbState==="pending"?"Connexion à la base de réponses…":"Cette vue n'a pas accès aux réponses enregistrées.")));
    return;
  }
  const data=filtered();
  const va=vwAnalyse(data.filter(r=>r.VERSION==="A")),vb=vwAnalyse(data.filter(r=>r.VERSION==="B"));
  v.append(el("div",{class:"kpis"},
    el("div",{class:"kpi"},el("b",{},data.length),el("span",{},`réponses (A : ${data.filter(r=>r.VERSION==="A").length} · B : ${data.filter(r=>r.VERSION==="B").length})`)),
    el("div",{class:"kpi"},el("b",{},fe(va.opp)),el("span",{},"prix optimal, bouteille en verre (A)")),
    el("div",{class:"kpi"},el("b",{},fe(vb.opp)),el("span",{},"prix optimal, bouteille en carton plastifié (B)"))));
  const selV=el("select",{id:"f-version"},[["all","A et B"],["A","A · bouteille en verre"],["B","B · bouteille en carton plastifié"]].map(([k,l])=>el("option",{value:k,selected:F.version===k},l)));
  selV.onchange=()=>{F.version=selV.value;render()};
  const selA=el("select",{id:"f-age"},[el("option",{value:"all"},"Toutes"),...AGES.map(x=>el("option",{value:x,selected:F.age===x},x))]);
  const gq=Q.find(q=>q.id==="GENRE");
  const selG=el("select",{id:"f-genre"},[el("option",{value:"all"},"Tous"),...gq.options.map(x=>el("option",{value:x,selected:F.genre===x},x))]);
  selA.onchange=()=>{F.age=selA.value;render()};selG.onchange=()=>{F.genre=selG.value;render()};
  v.append(el("section",{class:"card"},
    el("div",{class:"filters"},el("label",{for:"f-version"},"Version",selV),el("label",{for:"f-age"},"Tranche d'âge",selA),el("label",{for:"f-genre"},"Genre",selG),
      el("button",{class:"btn ghost",id:"export",onclick:exportCsv},"Exporter en CSV")),
    el("div",{class:"meta",id:"export-msg"},`${data.length} réponse${data.length>1?"s":""} dans la sélection. Une ligne par répondant, avec la version vue.`)));
  if(!rows.length){v.append(el("section",{class:"card empty"},"Aucune réponse enregistrée pour l'instant. Les résultats apparaîtront ici dès la première réponse au questionnaire."));return}
  v.append(el("section",{class:"card",style:"--flav:var(--fraise)"},drips(),el("h2",{class:"section-title"},"Prix accepté : verre contre carton plastifié"),vwTable(data)));
  const secs=[...new Set(Q.filter(q=>q.type!=="offer").map(q=>SEC[q.id]))];
  secs.forEach((sec,k)=>{
    const card=el("section",{class:"card",style:`--flav:var(${SECCOL[(k+1)%SECCOL.length]})`},drips(),el("h2",{class:"section-title"},sec));
    for(const q of Q.filter(q=>q.type!=="offer"&&SEC[q.id]===sec))card.append(bars(q,data,""));
    v.append(card);
  });
}
async function exportCsv(){
  const data=filtered(), cols=["date","VERSION","VW_COHERENT"];
  for(const q of Q){if(q.type==="offer")continue;if(q.type==="grid"||q.type==="likert")q.rows.forEach((r,ri)=>cols.push(q.id+"_"+(ri+1)));else cols.push(q.id)}
  const esc=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const lines=[cols.join(";")];
  for(const r of data){lines.push(cols.map(c=>{
    const g=Q.find(q=>(q.type==="grid"||q.type==="likert")&&c.startsWith(q.id+"_"));
    if(g){const row=g.rows[Number(c.slice(g.id.length+1))-1];return esc(r[g.id]?.[row])}
    const v=r[c];return esc(Array.isArray(v)?v.join(" | "):typeof v==="number"?String(v).replace(".",","):v)}).join(";"))}
  const msg=document.getElementById("export-msg");
  try{const d=await claude.use("downloads");if(!d){msg.textContent="L'export n'est pas disponible dans cette vue.";return}
    await d.save({filename:"monin-verre-carton-AB.csv",data:"﻿"+lines.join("\n")});msg.textContent="Fichier CSV prêt."}
  catch(e){msg.textContent=e&&e.code==="cancelled"?"Export annulé.":"L'export a échoué. Réessayez."}
}
